name: Deploy SPK Generator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://mqmhjgxjkapksvoorwcl.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_5QMpRNbKtXZfYdrL3C9k7Q_kseRDUJB
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Diagnose Supabase connectivity
        shell: bash
        run: |
          set -u
          echo "Probing Supabase endpoints (key values are never printed)"
          curl -sS --max-time 20 -o /tmp/auth-health.json -w 'auth-health HTTP %{http_code}\n' "${SUPABASE_URL}/auth/v1/health" || true
          curl -sS --max-time 20 -o /tmp/auth-settings.json -w 'auth-settings HTTP %{http_code}\n' -H "apikey: ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/auth/v1/settings" || true
          curl -sS --max-time 20 -o /tmp/rest-openapi.json -w 'rest-root HTTP %{http_code}\n' -H "apikey: ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/rest/v1/" || true
          printf 'auth-settings response: '
          head -c 300 /tmp/auth-settings.json 2>/dev/null || true
          printf '\n'
          printf 'rest-root response starts: '
          head -c 200 /tmp/rest-openapi.json 2>/dev/null || true
          printf '\n'
      - name: Install dependencies
        run: npm install

      - name: Check source and build public site
        run: npm run check && npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
